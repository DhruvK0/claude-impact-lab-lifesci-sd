[project]
name = "cohortlens"
version = "1.0.0"
description = "Clinical Evidence Assurance: adversarial peer-reviewed multi-agent DSMB workflow with hallucination evals (synthetic data only)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "anthropic>=2.3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cohortlens = "cohortlens.__main__:main"

[tool.setuptools]
packages = ["cohortlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
