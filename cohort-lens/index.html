<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cohort Lens — Adversarial safety review for the DSMB</title>
  <meta name="description" content="A guided five-step workflow: a DSMB agent issues cited safety verdicts per participant, adversarial expert reviewers and deterministic checks challenge them, and a research associate resolves what remains.">
  <!-- Design tokens + base components (Broadsheet design system) -->
  <link rel="stylesheet" href="css/broadsheet.css">
  <!-- Page-specific layout -->
  <link rel="stylesheet" href="css/app.css">
  <!-- Dark ground: token overrides only -->
  <link rel="stylesheet" href="css/theme-dark.css">
</head>
<body>
  <div class="page">
    <header>
      <div class="rule-thick-thin"></div>
      <div class="masthead">
        <div class="masthead-brand">
          <span class="brand">Cohort Lens</span>
          <span class="muted small">Adversarial safety review for the DSMB</span>
        </div>
        <span class="muted small" id="dl-ra">Research associate</span>
      </div>
      <div class="rule-thin"></div>
      <div class="dateline">
        <strong id="dl-study">Study CVX-214-101</strong>
        <span id="dl-design">Phase 1b · multiple ascending dose</span>
        <span id="dl-indication">Blood pressure &amp; triglyceride lowering</span>
        <span id="dl-participants">50 participants · placebo, 25, 50, 100, 200, 400 mg</span>
        <span id="dl-cut">Data cut</span>
        <span id="dl-source" class="muted"></span>
        <span class="synthetic">Synthetic data</span>
      </div>
      <div class="rule-thin-thick"></div>
    </header>

    <!-- Everything below the masthead is rendered by js/app.js -->
    <main id="app" aria-live="polite"></main>
  </div>

  <!-- Hidden file picker used by the "Browse files" button in step 1 -->
  <input type="file" id="file-input" multiple hidden>

  <!-- data.js is generated by `python -m cohortlens export-frontend`; loader.js swaps in the live API when ?api= is set, then starts app.js -->
  <script src="js/data.js"></script>
  <script src="js/loader.js"></script>
</body>
</html>
